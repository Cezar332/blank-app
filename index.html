<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Tarot Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quantum Tarot Reader</h1>
        <p>Unveil your destiny through the quantum realm.</p>
    </header>
    <main>
        <div class="controls">
            <button id="draw-card-btn">Draw a Card</button>
        </div>
        <div id="card-display">
            <div class="card-placeholder">
                <p>Click "Draw a Card" to reveal your fate.</p>
            </div>
        </div>
        <div id="card-interpretation">
            <h2>Card Meaning</h2>
            <p id="card-name"></p>
            <p id="card-meaning"></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 QuantumMystics. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
