<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Tarot Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quantum Tarot Reader</h1>
        <p>Your Portal to Real-Time Insight, Clarity & Direction.</p>
    </header>
    <main>
        <div class="controls">
            <button id="focus-reveal-btn">Focus and Reveal</button>
            <p class="instructions">Tap 'Focus and Reveal' to receive your insight.</p>
        </div>
        <div id="card-display">
            <!-- Initial state can be the placeholder, or the card-entity directly -->
            <!-- Using card-entity directly for the flip effect from the start -->
            <div class="card-entity">
                <div class="card-face card-back">
                    <p>Observe the Quantum Field</p>
                </div>
                <div class="card-face card-front">
                    <!-- Content will be populated by JS: <h3>Card Name</h3><p>(Quantum Signature Observed)</p> -->
                </div>
            </div>
            <!-- Fallback if something goes wrong with card-entity or for initial non-JS view -->
            <!-- <div class="card-placeholder" style="display:none;">
                <p>Focus your energy to reveal your fate.</p>
            </div> -->
        </div>
        <div id="card-interpretation">
            <h2>Card Meaning</h2>
            <p id="card-name"></p>
            <p id="card-meaning"></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 QuantumMystics. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
